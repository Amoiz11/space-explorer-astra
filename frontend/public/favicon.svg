<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E192D"/>
      <stop offset="100%" stop-color="#05070D"/>
    </radialGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4DA3FF"/>
      <stop offset="50%" stop-color="#80BFFF"/>
      <stop offset="100%" stop-color="#3DDC97"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background disc -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect width="64" height="64" rx="16" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Orbital ellipse -->
  <g transform="translate(32, 32) rotate(-28)">
    <ellipse cx="0" cy="0" rx="22" ry="9" stroke="url(#orbitGrad)" stroke-width="2.5" fill="none" opacity="0.9" filter="url(#glow)"/>
    <!-- Small orbiting satellite/moon node -->
    <circle cx="21" cy="-2.5" r="2.5" fill="#FFFFFF"/>
    <circle cx="21" cy="-2.5" r="4.5" fill="#4DA3FF" opacity="0.4"/>
  </g>

  <!-- Center planet with atmospheric glow -->
  <circle cx="32" cy="32" r="10" fill="#0A1832"/>
  <circle cx="32" cy="32" r="8.5" fill="url(#orbitGrad)"/>
  <circle cx="29" cy="29" r="4" fill="#FFFFFF" opacity="0.4"/>
</svg>
