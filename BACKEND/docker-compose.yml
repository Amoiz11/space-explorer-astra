version: "3.8"

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: space_explorer_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: space_explorer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d space_explorer"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - space_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: space_explorer_backend
    restart: unless-stopped
    environment:
      APP_NAME: "Space Explorer API"
      APP_ENV: development
      DEBUG: "True"
      API_V1_PREFIX: /api/v1
      DATABASE_URL: postgresql://postgres:postgres@db:5432/space_explorer
      SECRET_KEY: dev-secret-key-change-in-production
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/workspace/backend
    networks:
      - space_network

volumes:
  postgres_data:
    name: space_explorer_pgdata

networks:
  space_network:
    name: space_explorer_network
